{% extends 'base.html' %}
{% block title %}Detalles del pedido{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card wide">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Datos de entrega</h1>
    </div>
    <div class="total-box">
      <div>Total a pagar</div>
      <div class="amount">RS {{total_val}}</div>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
        <div class="form-row">
          <div class="col-12 col-md-3 mb-2"><input type="text" class="form-control" placeholder="Número de casa" name="HNO"></div>
          <div class="col-12 col-md-3 mb-2"><input type="text" class="form-control" placeholder="Ciudad" name="City"></div>
          <div class="col-12 col-md-3 mb-2"><input type="text" class="form-control" placeholder="Estado" name="State"></div>
          <div class="col-12 col-md-3 mb-2"><input type="text" class="form-control" placeholder="Código postal" name="Pincode"></div>
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Forma de pago" name="Mode">
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-danger">Confirmar pedido</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
