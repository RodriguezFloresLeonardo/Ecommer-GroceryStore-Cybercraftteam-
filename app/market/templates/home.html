{% extends 'base.html' %}
{% block title %}Menú{% endblock %}

{% block content %}
<div class="catalog">
  {% for dict in list %}
  <div class="product-card">
    <!-- IMAGEN DEL PRODUCTO: guarda la foto en static/img/products/ con el nombre del producto
         en minúsculas y con guiones bajos, ej. "Café Latte" -> cafe_latte.jpg (sin acentos si tu servidor lo requiere) -->
    <img class="thumb" src="{{ url_for('static', filename='img/products/' ~ dict.Name|lower|replace(' ','_') ~ '.jpg') }}" alt="{{ dict.Name }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/products/default.svg') }}';">
    <div class="info">
      <h3 class="p-name">{{ dict.Name }}</h3>
      <p class="p-brand">{{ dict.Brand }}</p>
      <span class="p-price">RS {{ dict.Price }}</span>
      <form action="" method="GET">
        <input type="hidden" name="Name" value="{{ dict.Name }}">
        <input type="hidden" name="Brand" value="{{ dict.Brand }}">
        <input type="hidden" name="Price" value="{{ dict.Price }}">
        <button type="submit" class="btn btn-primary">Agregar al carrito</button>
      </form>
    </div>
  </div>
  {% else %}
  <p class="catalog-empty">Todavía no hay productos disponibles.</p>
  {% endfor %}
</div>
{% endblock %}

{% block navBar %}
<form class="nav-form" method="POST" action="">
  <button class="btn btn-nav" type="submit">Mi carrito</button>
</form>
{% endblock %}
