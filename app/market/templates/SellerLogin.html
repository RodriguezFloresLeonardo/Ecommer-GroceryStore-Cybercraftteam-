{% extends 'base.html' %}
{% block title %}Acceso de vendedor{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Acceso de vendedor</h1>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
    <div class="form-group">
      <input type="email" class="form-control" placeholder="Correo electrónico" name="Email">
      <small class="form-text">Nunca compartiremos tu correo con nadie.</small>
    </div>
    <div class="form-group">
      <input type="password" class="form-control" placeholder="Contraseña" name="Password">
      <small class="form-text">Entre 8 y 20 caracteres, con letras y números, sin espacios, caracteres especiales ni emojis.</small>
    </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
