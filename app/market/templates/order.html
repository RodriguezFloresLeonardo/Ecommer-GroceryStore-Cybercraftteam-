{% extends 'base.html' %}
{% block title %}Mi carrito{% endblock %}

{% block content %}
<div class="catalog">
  {% for dict in list %}
  <div class="product-card">
    <!-- IMAGEN DEL PRODUCTO: misma regla que en home.html (static/img/products/nombre_del_producto.jpg) -->
    <img class="thumb" src="{{ url_for('static', filename='img/products/' ~ dict.Name|lower|replace(' ','_') ~ '.jpg') }}" alt="{{ dict.Name }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/products/default.svg') }}';">
    <div class="info">
      <h3 class="p-name">{{ dict.Name }}</h3>
      <p class="p-brand">{{ dict.Brand }}</p>
      <span class="p-price">RS {{ dict.Price }}</span>
    </div>
  </div>
  {% else %}
  <p class="catalog-empty">Tu carrito está vacío.</p>
  {% endfor %}
</div>
{% endblock %}

{% block navBar %}
<form class="nav-form" method="POST">
  <input class="form-control" type="search" placeholder="Código de cupón" name="Promo_Code">
  <button class="btn btn-danger" type="submit">Hacer pedido</button>
</form>
{% endblock %}
