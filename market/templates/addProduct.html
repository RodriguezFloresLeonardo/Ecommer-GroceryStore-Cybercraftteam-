{% extends 'base.html' %}
{% block title %}Panel de vendedor{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Agregar existencias</h1>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Nombre del producto" name="Name">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Marca" name="Brand">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Cantidad a agregar" name="Quantity">
    </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Agregar existencias</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
