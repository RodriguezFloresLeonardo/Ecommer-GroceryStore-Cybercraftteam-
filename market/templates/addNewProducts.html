{% extends 'base.html' %}
{% block title %}Panel de vendedor{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Datos del producto</h1>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Nombre del producto" name="Name">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Marca" name="Brand">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Precio" name="Price">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Medida" name="Measurement">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Unidad de medida" name="Unit">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="ID de categoría" name="Category_ID">
    </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Guardar producto</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block navBar %}
<a class="btn btn-nav ml-auto" href="/admin/{{admin_id}}">Volver</a>
{% endblock %}
