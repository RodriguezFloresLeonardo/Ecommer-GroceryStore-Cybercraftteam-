{% extends 'base.html' %}
{% block title %}Registro de administrador{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Registro de administrador</h1>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
    <div class="form-row">
      <div class="col"><input type="text" class="form-control" placeholder="Nombre" name="First_Name"></div>
      <div class="col"><input type="text" class="form-control" placeholder="Apellido" name="Last_Name"></div>
    </div>
    <div class="form-group">
      <input type="password" class="form-control" placeholder="Contraseña" name="Password">
      <small class="form-text">Entre 8 y 20 caracteres, con letras y números, sin espacios, caracteres especiales ni emojis.</small>
    </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Registrarme</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
