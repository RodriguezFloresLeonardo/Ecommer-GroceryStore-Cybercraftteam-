{% extends 'base.html' %}
{% block title %}Panel de vendedor{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Datos de la oferta</h1>
    </div>
    <div class="card-body-pad">
      <form method="POST" action="">
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Código promocional" name="Promo_Code">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Porcentaje de descuento" name="Percentage_Discount">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Valor mínimo del pedido" name="Min_OrderValue">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Descuento máximo" name="Max_Discount">
    </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Guardar oferta</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block navBar %}
<a class="btn btn-nav ml-auto" href="/admin/{{admin_id}}">Volver</a>
{% endblock %}
