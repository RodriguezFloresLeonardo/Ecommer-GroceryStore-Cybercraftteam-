{% extends 'base.html' %}
{% block title %}Clientes{% endblock %}

{% block content %}
<div class="page-center">
  <div class="form-card">
    <div class="card-head">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Transporte Express de Comida">
      <h1>Clientes: inicia sesión o regístrate</h1>
    </div>
    <div class="choice-wrap">
      <a class="btn btn-primary" href="{{url_for('UserLogin')}}">Iniciar sesión</a>
      <a class="btn btn-lime" href="{{url_for('customerRegister')}}">Registrarme</a>
    </div>
  </div>
</div>
{% endblock %}
